version: '3.8'

services:
  db:
    image: postgres:15
    container_name: palmery_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: palmery_backend
    restart: always
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
